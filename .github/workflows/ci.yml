name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      # The OpenClaw SDK is a peer dependency: install the version the plugin is built against.
      - run: npm install --no-save --legacy-peer-deps --ignore-scripts openclaw@2026.11.10
      - run: npm test
      - run: npm run build
